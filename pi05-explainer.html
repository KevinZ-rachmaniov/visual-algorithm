const GLOSSARY = [
  { term: 'VLA', english: 'Vision–Language–Action', meaning: '把视觉、语言和机器人动作联系起来的模型。', example: '看见桌面，理解“拿起杯子”，输出动作目标。' },
  { term: '张量', english: 'Tensor', meaning: '带有多个维度的数字数组；形状描述每个维度的长度。', example: '[1,50,32]：1份样本、50个动作时间步、32个通道。' },
  { term: '批次', english: 'Batch', meaning: '一次并行处理的样本集合，用B表示数量。', example: 'B=1时，仅演示一份观测。' },
  { term: 'Token', english: 'Token', meaning: '序列里的一个位置或信息单元。在VLA中既有离散文字，也有连续图像/动作表示。', example: '一块图像形成一个连续token；它不一定对应一个物体。' },
  { term: '嵌入', english: 'Embedding', meaning: '把输入表示成适合神经网络计算的向量。', example: '一个文字ID查表后变成2048维向量。' },
  { term: 'Patch', english: 'Image patch', meaning: '从图像中划出的一小块像素。', example: '224×224的图用14×14切块，得到256块。' },
  { term: '权重', english: 'Parameter / Weight', meaning: '训练中学到、推理时通常固定的数值，用于把输入变换成输出。', example: '线性层y=xW+b中的W和b。注意力权重则是本次输入算出的另一类数值。' },
  { term: '注意力', english: 'Attention', meaning: '按照当前Query与各Key的匹配程度，读取并汇总Value信息。', example: '一个动作token可以读取图像、指令与其他动作位置。' },
  { term: '掩码', english: 'Mask', meaning: '规定哪些位置有效、哪些信息允许被读取。', example: '前缀不能读取动作suffix；padding也会被屏蔽。' },
  { term: 'Softmax', english: 'Softmax', meaning: '把一组分数转换为非负且总和为1的权重。', example: '[0.707,0]大约变为[0.670,0.330]。' },
  { term: '残差连接', english: 'Residual connection', meaning: '保留原输入，把当前模块的更新加回去。', example: 'h_next=h+update；动作分支还可以用gate调制更新。' },
  { term: '归一化', english: 'Normalization', meaning: '调整数值尺度。数据归一化与网络内部RMSNorm是不同操作。', example: '像素从0…255变到−1…1；RMSNorm则处理隐藏向量。' },
  { term: 'KV缓存', english: 'Key–Value cache', meaning: '保存已经计算好的Key和Value，减少重复计算。', example: '同一动作块的生成迭代复用图像与文字前缀缓存。' },
  { term: '动作块', english: 'Action chunk', meaning: '一次预测的一段未来动作序列。', example: '默认50步是序列长度，不自动等于50Hz或1秒。' },
  { term: '流匹配', english: 'Flow matching', meaning: '训练模型预测生成空间中的变化方向，再通过积分生成样本。', example: 'openpi从t=1的噪声走到t=0的动作。' },

e="button">计算一步</button><button class="lab-btn lab-play" type="button">播放生成</button><button class="lab-btn lab-reset-flow" type="button">重置噪声</button><span class="lab-current lab-muted"></span></div><div class="lab-progress"><span></span></div><div class="lab-columns"><div class="lab-card"><h4>当前动作块 · 3 个物理时间步 × 2 个通道</h4><div class="lab-current-matrix"></div><p class="lab-caption">每次生成迭代，6 个数字同时更新。缩小的 3 × 2 示例对应真实模型默认的 50 × 32。</p><div class="lab-current-formula lab-formula"></div></div><div class="lab-card"><h4>6 个动作值沿生成步骤的变化</h4><div class="lab-trajectory"></div><p class="lab-caption">横轴是生成迭代次数，不是机器人运行的物理时间；纵轴是模型空间中的动作值。</p></div></div><div class="lab-trace" style="margin-top:16px"><table class="lab-tiny-table"><thead><tr><th>步</th><th>t</th><th>更新前 x₁</th><th>预测场 v₁</th><th>Δt</th><th>更新后 x₁</th></tr></thead><tbody class="lab-log"></tbody></table></div><p class="lab-caption">真实 π0.5 在每一步重新计算动作专家，复用已缓存的图像／文本前缀。这里的 v 是生成空间的向量场，不等于机械臂的物理速度。</p></div>`;
 function train(){const a=finite(body.querySelector('.lab-a').value),eps=finite(body.querySelector('.lab-epsilon').value),t=finite(body.querySelector('.lab-t').value),v=finite(body.querySelector('.lab-v').value),x=t*eps+(1-t)*a,u=eps-a,loss=(v-u)**2;body.querySelector('.lab-t-label').textContent=fmt(t,2);body.querySelector('.lab-training-result').innerHTML=`<h4>这一维的数据流</h4><div class="lab-bar"><span class="lab-marker" style="left:${t*100}%"></span></div><div class="lab-between"><span>t=0 · 正确动作</span><span>t=1 · 噪声</span></div><div class="lab-stat-grid"><div class="lab-stat"><span>带噪输入 xₜ</span><b>${fmt(x)}</b></div><div class="lab-stat"><span>目标速度 u</span><b>${fmt(u)}</b></div><div class="lab-stat"><span>这一维 MSE</span><b>${fmt(loss)}</b></div></div><div class="lab-formula">xₜ = tε + (1−t)a\n   = ${fmt(t)} × ${fmt(eps)} + ${fmt(1-t)} × ${fmt(a)} = ${fmt(x)}\nu  = ε − a = ${fmt(eps)} − (${fmt(a)}) = ${fmt(u)}\nL  = (v − u)² = (${fmt(v)} − ${fmt(u)})² = ${fmt(loss)}</div>`;}
 function graph(){const w=420,h=210,p=30,all=history.flatMap(r=>r.x),lo=Math.min(-1,...all)-.15,hi=Math.max(1,...all)+.15,px=i=>p+i/N*(w-2*p),py=v=>h-p-(v-lo)/(hi-lo)*(h-2*p);const colors=['#b073cc','#7456bc','#d99b4a','#dd7953','#4da49b','#6b9fcc'];return `<svg class="lab-graph" viewBox="0 0 ${w} ${h}" role="img" aria-label="六个教学动作值随生成迭代变化的曲线">${[0,.5,1].map(fr=>{const y=p+fr*(h-2*p);return `<line x1="${p}" y1="${y}" x2="${w-p}" y2="${y}" stroke="#ece7f2"/><text x="3" y="${y+3}">${fmt(hi-fr*(hi-lo),1)}</text>`;}).join('')}<line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" stroke="#d9d0e5"/>${[0,N/2,N].map(i=>`<text x="${px(i)-3}" y="${h-9}">${i}</text>`).join('')}${colors.map((c,j)=>`<polyline fill="none" stroke="${c}" stroke-width="2" points="${history.map((r,i)=>`${px(i)},${py(r.x[j])}`).join(' ')}"/><circle cx="${px(step)}" cy="${py(values[j])}" r="3" fill="${c}"/>`).join('')}</svg>`;}
 function draw(){body.querySelector('.lab-current').textContent=`第 ${step} / ${N} 步 · t = ${fmt(1-step/N,2)} · Δt = ${fmt(-1/N,2)}`;body.querySelector('.lab-progress>span').style.width=`${step/N*100}%`;body.querySelector('.lab-current-matrix').innerHTML=readonlyMatrix([values.slice(0,2),values.slice(2,4),values.slice(4,6)]);body.querySelector('.lab-current-formula').textContent=last?`第一维：v = ${k} × (${fmt(last.old)} − ${centers[condition][0]}) = ${fmt(last.v)}\nx新 = ${fmt(last.old)} + (${fmt(-1/N)}) × ${fmt(last.v)}\n    = ${fmt(values[0])}`:`初始 x₁ = ${fmt(values[0])}\n点击“计算一步”，观察 Euler 更新。`;body.querySelector('.lab-trajectory').innerHTML=graph();body.querySelector('.lab-step').disabled=step>=N;body.querySelector('.lab-play').disabled=step>=N;body.querySelector('.lab-log').innerHTML=history.slice(1).map((r,i)=>`<tr><td>${i+1}</td><td>${fmt(1-i/N,2)} → ${fmt(1-(i+1)/N,2)}</td><td>${fmt(r.old)}</td><td>${fmt(r.v)}</td><td>${fmt(-1/N)}</td><td>${fmt(r.x[0])}</td></tr>`).join('')||'<tr><td colspan="6">还没有执行更新。第一行将记录真实的教学算式。</td></tr>';}

 function advance(){if(step>=N)return;const old=values[0],v=k*(old-centers[condition][0]);values=values.map((x,i)=>x-(k/N)*(x-centers[condition][i]));step++;last={old,v};history.push({x:[...values],old,v});if(step>=N)stop();draw();}
 body.querySelectorAll('[data-flow-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.flowTab;stop();body.querySelectorAll('[data-flow-tab]').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.flowTab===tab)));body.querySelector('.lab-training').classList.toggle('lab-hidden',tab!=='train');body.querySelector('.lab-inference').classList.toggle('lab-hidden',tab!=='infer');}));
 body.querySelector('.lab-training').addEventListener('input',train);
 body.querySelector('.lab-step').addEventListener('click',advance);body.querySelector('.lab-reset-flow').addEventListener('click',reset);body.querySelector('.lab-play').addEventListener('click',()=>{if(timer){stop();return;}body.querySelector('.lab-play').textContent='暂停';timer=setInterval(()=>{if(!container.isConnected){stop();return;}advance();},550);});
 [['.lab-seed',v=>seed=Math.max(1,Math.min(99999,Math.round(finite(v,42))))],['.lab-n',v=>N=+v],['.lab-k',v=>k=+v],['.lab-condition',v=>condition=+v]].forEach(([sel,fn])=>body.querySelector(sel).addEventListener('change',e=>{fn(e.target.value);reset();}));train();reset();return stop;
}

function patchLab(container){
 const body=shell(container,'图像怎样变成 256 个 token？','先把每个像素的红、绿、蓝数值归一化，再以 14 × 14 的小方块切分图像。点击下面任意方块，追踪它的坐标与后续形状变化。');
 let patch=119;
 const rgb=(r,c)=>{const cup=(c-6)**2/7+(r-9)**2/16<1;const tray=r>9&&c>9&&c<15;return cup?[194+r*2,92+c*3,94+r]:tray?[138+r*3,173+c*2,162]:[226-r*3,220-c*2,236-r*2];};
 body.innerHTML=`<div class="lab-columns"><div class="lab-card"><h4>一张 224 × 224 的 RGB 示意图</h4><div class="lab-patch-grid">${Array.from({length:256},(_,i)=>{const r=Math.floor(i/16),c=i%16;return `<button class="lab-patch" type="button" data-patch="${i}" aria-label="选择 patch 第 ${r+1} 行第 ${c+1} 列" aria-pressed="${i===patch}" style="background:rgb(${rgb(r,c).join(',')})"></button>`;}).join('')}</div><p class="lab-caption">此图是程序绘制的色块示意，不是模型输入照片或模型注意力热图。</p></div><div class="lab-card lab-patch-description" aria-live="polite"></div></div><div class="lab-path"><span>224 × 224 × 3</span>→<span>256 × 588</span>→<span>256 × 1152</span>→<span>27 层视觉编码</span>→<span>256 × 2048</span></div><p class="lab-caption">真实 openpi 默认：SigLIP So400m/14 内部宽 1152；每个 patch 包含 14×14×3 = 588 个像素通道值，最后每个视觉 token 投影到语言模型的 2048 维。256 = 16×16；并不平均成一个全图向量。</p><div class="lab-card"><h4>把投影缩小到一个能手算的例子</h4><p>用 2 × 2 像素、每像素 RGB 的小块，共 12 个数。这里只计算输出向量的第 1 维；真实模型会同时计算 1152 维。</p><label class="lab-field">左上像素的 R <input class="lab-r" type="range" min="0" max="255" step="1" value="128"><output class="lab-slider-value lab-r-value">128</output></label><div class="lab-projection-result"></div></div>`;
 function describe(){const r=Math.floor(patch/16),c=patch%16,color=rgb(r,c);body.querySelectorAll('[data-patch]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.patch===patch)));body.querySelector('.lab-patch-description').innerHTML=`<h4>Patch #${patch} · 从 0 开始编号</h4><div class="lab-pixel-detail" style="background:rgb(${color.join(',')})">row ${r} / col ${c}</div><div class="lab-formula">图像行：${r*14} … ${r*14+13}\n图像列：${c*14} … ${c*14+13}\n像素值：14 × 14 × 3 = 588 个数\n示意 RGB = [${color.join(', ')}]\n归一化 = [${color.map(x=>fmt(x/255*2-1,3)).join(', ')}]</div><p class="lab-caption">公式：x_norm = x_uint8 / 255 × 2 − 1。位置编码让网络知道这个 patch 原来位于哪里。</p>`;}
 function project(){const r=+body.querySelector('.lab-r').value;body.querySelector('.lab-r-value').textContent=r;const pixels=[r,64,32,200,100,50,20,160,80,240,220,200],x=pixels.map(v=>v/255*2-1),w=[.1,.2,-.1,.05,.15,-.2,.1,-.05,.2,.1,.05,-.1],bias=.03,y=dot(x,w)+bias;body.querySelector('.lab-projection-result').innerHTML=`<div class="lab-chips">${pixels.map((v,i)=>`<span class="lab-chip">${['R','G','B'][i%3]}${Math.floor(i/3)+1}: ${v}</span>`).join('')}</div><div class="lab-formula">x = [${x.map(v=>fmt(v,3)).join(', ')}]\nw = [${w.join(', ')}]\ny₁ = Σ(xᵢ × wᵢ) + 0.03\n   = ${x.map((v,i)=>`${fmt(v,3)}×${w[i]}`).join(' + ')} + 0.03\n   = ${fmt(y)}</div><p class="lab-caption">上面的 w 和偏置 0.03 都是手工教学权重。像素展平后乘权重，与步长等于 patch 大小的卷积在这里表达同一类线性投影。</p>`;}
 body.addEventListener('click',e=>{const b=e.target.closest('[data-patch]');if(b){patch=+b.dataset.patch;describe();}});body.querySelector('.lab-r').addEventListener('input',project);describe();project();return ()=>{};
}

function stateLab(container){
 const body=shell(container,'机器人的状态怎样变成文字？','机器人状态可以是关节角、夹爪开合等数值。π0.5 的公开实现把归一化状态分箱，再将这些整数写进文本提示。状态数字不是直接送入语言模型的词表 ID。');
 body.innerHTML=`<div class="lab-columns"><div class="lab-card"><h4>观察一维归一化状态 s</h4><label class="lab-field">s <input class="lab-state-slider" type="range" min="-1" max="1" step="0.0078125" value="0"><output class="lab-slider-value lab-state-value">0</output></label><div class="lab-bar" style="background:linear-gradient(90deg,#78b7c7,#dfc8ef)"><span class="lab-marker lab-state-marker" style="left:50%"></span></div><div class="lab-between"><span>−1</span><span>0</span><span>+1</span></div><div class="lab-controls"><button type="button" class="lab-btn" data-state="-0.5">−0.5</button><button type="button" class="lab-btn" data-state="0">0</button><button type="button" class="lab-btn" data-state="0.5">+0.5</button></div><p class="lab-caption">这里只操作“已经归一化”的状态。实际归一化由数据集统计量与机器人适配器决定，不能直接把任意关节角塞进此滑块。</p></div><div class="lab-card lab-state-result" aria-live="polite"></div></div><div class="lab-card" style="margin-top:18px"><h4>拼成字符串，再做真正的分词</h4><div class="lab-state-prompt lab-formula"></div><div class="lab-path"><span>状态分箱整数</span>→<span>文本中的数字字符</span>→<span>SentencePiece token ID</span>→<span>查表得到 embedding</span></div><p class="lab-note">“128”是状态所在区间的编号。分词器可能将一个数字串拆成多个 token；不能断言 128 就是词表 ID 128，也不能断言每个状态占一个 token。本网页没有加载官方 SentencePiece 分词器，因此不伪造真实 token ID。</p></div>`;
 function draw(){const s=+body.querySelector('.lab-state-slider').value;const raw=Math.floor((s+1)*128),bin=Math.min(255,Math.max(0,raw));const low=-1+bin/128,high=low+1/128;body.querySelector('.lab-state-value').textContent=fmt(s,4);body.querySelector('.lab-state-marker').style.left=`${(s+1)*50}%`;body.querySelector('.lab-state-result').innerHTML=`<h4>落在第 ${bin} 号区间</h4><div class="lab-stat-grid"><div class="lab-stat"><span>区间总数</span><b>256</b></div><div class="lab-stat"><span>区间宽度</span><b style="font-size:16px">1/128</b></div><div class="lab-stat"><span>分箱编号</span><b>${bin}</b></div></div><div class="lab-formula">bin = clip(floor((s + 1) × 128), 0, 255)\n    = clip(floor((${fmt(s)} + 1) × 128), 0, 255)\n    = ${bin}\n区间 ≈ [${fmt(low,6)}, ${fmt(high,6)}${bin===255?']':')'}</div><p class="lab-caption">这是 [-1,1] 内的等价教学写法，端点 +1 对应 255。源码使用 np.digitize 与 256 个左边界；对超出范围的输入不能假定源码自动做同样的双边截断。</p>`;body.querySelector('.lab-state-prompt').textContent=`Task: pick up the red cup, State: 64 ${bin} 192;\nAction: `;}
 body.querySelector('.lab-state-slider').addEventListener('input',draw);body.querySelectorAll('[data-state]').forEach(b=>b.addEventListener('click',()=>{body.querySelector('.lab-state-slider').value=b.dataset.state;draw();}));draw();return ()=>{};
}

function normLab(container){
 const body=shell(container,'归一化与时间条件，具体改了哪些数？','RMSNorm 先控制一排数字的整体大小。动作专家再用时间条件产生的 scale、shift、gate 调节计算。下面直接编辑这些调节量，观察每一项发生的变化。');
 let vector=[1,2,-1,0];
 body.innerHTML=`<div class="lab-columns"><div class="lab-card"><h4>输入向量 h · 教学 4 维</h4><div class="lab-chips">${vector.map((v,i)=>`<input class="lab-inline-input lab-h" type="number" value="${v}" step="0.1" data-i="${i}" aria-label="h 的第 ${i+1} 维">`).join('')}</div><label class="lab-field">scale <input type="number" class="lab-scale" value="0.2" step="0.1"></label><label class="lab-field">shift <input type="number" class="lab-shift" value="0.1" step="0.1"></label><label class="lab-field">gate <input type="number" class="lab-gate" value="0.5" step="0.1"></label><p class="lab-caption">真实模型由 t 的 embedding 和学习到的线性层产生逐维调节量。此处使用标量并广播到 4 个维度，便于观察。</p></div><div class="lab-card lab-norm-result" aria-live="polite"></div></div><div class="lab-result lab-norm-steps"></div><div class="lab-note">RMSNorm 不减均值：它不是 LayerNorm。gate 控制的是注意力／MLP 计算后的残差分支。下面为手算把那个分支函数简化为恒等映射 F(z)=z；真实网络里 F 包含注意力或门控 MLP，不能把本例当作完整 Transformer 层。</div>`;
 function draw(){vector=[...body.querySelectorAll('.lab-h')].map(e=>finite(e.value));const scale=finite(body.querySelector('.lab-scale').value),shift=finite(body.querySelector('.lab-shift').value),gate=finite(body.querySelector('.lab-gate').value),mean=vector.reduce((s,v)=>s+v*v,0)/vector.length,rms=Math.sqrt(mean+1e-6),norm=vector.map(v=>v/rms),z=norm.map(v=>v*(1+scale)+shift),out=z.map((v,i)=>vector[i]+gate*v);body.querySelector('.lab-norm-result').innerHTML=`<h4>同一输入的逐层变化</h4><table class="lab-tiny-table"><thead><tr><th>维度</th><th>h</th><th>归一化</th><th>调制后 z</th><th>残差结果</th></tr></thead><tbody>${vector.map((v,i)=>`<tr><th>${i+1}</th><td>${fmt(v)}</td><td>${fmt(norm[i])}</td><td>${fmt(z[i])}</td><td style="background:${tone(out[i])}">${fmt(out[i])}</td></tr>`).join('')}</tbody></table>`;body.querySelector('.lab-norm-steps').innerHTML=`<strong>把第 1 个数完整算一遍</strong><div class="lab-formula">mean(h²) = (${vector.map(v=>`(${fmt(v)})²`).join(' + ')}) / 4 = ${fmt(mean)}\nrms = √(${fmt(mean)} + 0.000001) = ${fmt(rms,6)}\nĥ₁ = ${fmt(vector[0])} / ${fmt(rms,6)} = ${fmt(norm[0])}\nz₁ = ĥ₁ × (1 + scale) + shift\n   = ${fmt(norm[0])} × ${fmt(1+scale)} + ${fmt(shift)} = ${fmt(z[0])}\ny₁ = h₁ + gate × F(z)₁，教学 F(z)=z\n   = ${fmt(vector[0])} + ${fmt(gate)} × ${fmt(z[0])} = ${fmt(out[0])}</div>`;}
 body.addEventListener('input',draw);draw();return ()=>{};
}

function installStyle() {
  if (document.getElementById('pi05-lesson-style')) return;
  const style = document.createElement('style');
  style.id = 'pi05-lesson-style';
  style.textContent = STYLE;
  document.head.appendChild(style);
}

function hostFor(container) {
  const host = typeof container === 'string' ? document.querySelector(container) : container;
  if (!host || typeof host.replaceChildren !== 'function') throw new TypeError('Please pass a container element to the lesson renderer.');
  installStyle();
  return host;
}

function sourceLinks(items) {
  return `<p class="lesson-source">对照原始资料：${items.map(([key, label]) => `<a href="${SOURCES[key]}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`).join('')}</p>`;
}

function details(title, body, open = false) {
  return `<details class="lesson-details"${open ? ' open' : ''}><summary>${title}</summary><div class="lesson-detail-body">${body}</div></details>`;
}

function flow(steps) {
  return `<div class="lesson-flow">${steps.map(([color, title, desc, code], i) => `<div class="lesson-flow-step lesson-${color}"><span class="lesson-step-n">0${i + 1}</span><h4>${title}</h4><p>${desc}</p>${code ? `<code>${code}</code>` : ''}</div>`).join('')}</div>`;
}

function publicPath() {
  return `<div class="lesson-panel-lead"><h3>给它此刻的观察，得到下一段动作</h3><p>从公开代码中的 <code>sample_actions</code> 看一次调用：已有的语言指令与相机画面作为条件，动作专家不断更新一整块动作数值。</p></div>
  ${flow([
    ['blue', '准备观察', '相机图像、任务文字、当前机器人状态。先经过与训练一致的预处理。', 'observation'],
    ['purple', '编码共同条件', '图像转为视觉表示，指令与离散化状态转为文字 token；计算前缀表示。', 'prefix → K / V cache'],
    ['orange', '生成动作块', '初始化整块高斯噪声。反复预测向量场并积分，所有时间槽一起更新。', 't : 1 → 0'],
    ['teal', '转换与执行', '得到动作数组，经机器人接口转换为目标。环境变化后，再获取新观察。', 'actions [B, H, D]'],
  ])}
  <div class="lesson-callout"><strong>这一条公开动作路径没有“先说出子任务”的步骤。</strong> <code>sample_actions</code> 返回动作，不负责生成高层计划。论文里的分层推理要看下一个标签页；不能只凭一次公开动作采样调用就认定完整分层系统已实现。</div>
  ${details('为什么机器人状态会出现在文字序列里？', `<p>关节位置、夹爪等状态本来是连续数值。π0.5 将处理后的状态分箱为整数，再组成文本并交给 tokenizer。这样视觉语言骨干也能接触身体状态。</p><div class="lesson-equation">连续状态 q → 归一化 → 分箱编号 → 文本 → token IDs → embedding</div><p>分箱是“把某个数放进一个区间”。教学例子：把 [−1, 1] 分成 4 格，−0.8 进入第 0 格，0.2 进入第 2 格。真实实现的分箱数与格式见源码；这里的 4 格只用于理解。</p><p>注意：分箱编号标记数值区间，不是词表ID，token ID 也不是关节角度本身。状态文字并不会绕过查表和后续神经网络。</p>${sourceLinks([['tokenizer', 'tokenizer.py']])}`)}
  ${details('一整段动作怎么同时更新？', `<p>设动作块有 H 个未来时间槽，每槽 D 个控制量，它就是 H × D 的数表。每次 flow 计算会为整张表输出同形状的变化方向，随后所有格子更新一次。</p><div class="lesson-equation">输入：当前动作草稿 zₜ ∈ ℝᴴˣᴰ
输出：预测向量场 vθ(zₜ, t, 条件) ∈ ℝᴴˣᴰ
更新：zₜ₊Δₜ = zₜ + Δt · vθ</div><p>例如 H=3、D=2，一轮会共同更新 6 个数。H 是“计划覆盖多少个物理时刻”，积分步数是“这张计划表被修订多少轮”，两者不是同一个长度。</p><p>模型可以在一次采样中缓存固定观察的前缀信息；噪声动作和 flow 时间变化，动作专家仍需重新计算。缓存是复用已算出的信息，不是把未来动作预先写好。</p>${sourceLinks([['model', 'pi0.py / sample_actions']])}`)}
  ${details('公开代码、模型权重与论文配方是什么关系？', `<p>公开 README 说明 π0.5 路径支持 flow matching head 的训练与推理。已发布权重使用了 Knowledge Insulation；这不表示当前公开训练入口完整重现了原始异构预训练和高层文本生成系统。</p><p>阅读代码时分别问三件事：这个函数执行什么？这个 checkpoint 以前怎么训练？论文评估的是哪套完整系统？三者相关，但不能互相代替。</p>${sourceLinks([['readme', 'openpi README'], ['release', '维护者对发布权重的说明']])}`)}
  ${sourceLinks([['model', '动作采样与 flow loss'], ['tokenizer', '状态文本编码'], ['readme', '公开实现范围']])}`;
}

function paperPath() {
  return `<div class="lesson-panel-lead"><h3>同一个模型，先决定子任务，再产生动作</h3><p>2025 年 π0.5 论文讨论的是一个分层系统。可以先用“整理桌面”这个大任务决定下一步做什么，再为这一步生成连续控制目标。</p></div>
  ${flow([
    ['blue', '观察 + 总任务', '看到桌面和物体，输入“整理桌面”。这些信息约束当前任务的含义。', 'o, ℓ'],
    ['purple', '预测子任务文字', '自回归生成一个语义步骤，例如“拿起红杯”。它是模型生成的文本。', 'p(子任务 | 观察, 总任务)'],
    ['orange', '条件化动作专家', '以当前观察和子任务为条件，从噪声生成一个连续动作块。', 'p(动作块 | 观察, 子任务)'],
    ['teal', '在世界中执行', '低层控制器跟踪目标。新的观察为后续动作或子任务选择提供反馈。', '动作 → 新观察'],
  ])}
  <div class="lesson-callout lesson-teal"><strong>“拿起红杯”不是电机指令。</strong> 它规定行为目标；动作专家仍需结合物体位置和机器人姿态，输出适合此刻的连续控制量。一个子任务可能需要多段动作才能完成。</div>
  ${details('高层文字与低层动作，为什么要分两种输出？', `<p>高层输出是有限词表中的 token，一个接一个地生成。低层输出需要连续数值，动作专家用 flow matching 同时修订整段动作。这是两条不同的输出路径。</p><p>“同一个模型”指论文设计中的共享视觉语言基础与相连的动作专家，不是把所有运算塞进一个完全相同的输出头。也不能从模型生成了一句子任务文字，推断它已经证明这一步安全或可完成。</p><div class="lesson-equation">总任务：整理桌面
语义步骤：拿起红杯
连续控制：未来若干时刻的各控制维度数值</div>${sourceLinks([['paper', '论文 IV-A：分层分布'], ['blog', '官方高层／低层示意']])}`)}
  ${details('怎样理解 50 个动作、10 次去噪与 50 Hz？', `<p>论文系统的动作块包含 50 个控制时刻，约覆盖 1 秒；采样该动作块使用 10 次去噪计算。50 Hz 描述物理目标发送的频率，不表示视觉语言模型每秒完整运行 50 次。</p><p>这组数字属于论文设置，不是所有公开配置和机器人都必须遵守的常数。实际 H、D、采样步数以及执行多少步后重新规划，应以所用配置和控制循环为准。</p>${sourceLinks([['paper', '论文 IV-B / IV-E / 附录 A-E']])}`)}
  ${details('“开放世界泛化”能保证不碰撞吗？', `<p>泛化实验考察模型在未见过的家庭、物体和布局下能否完成任务。它不等价于对所有初始条件、传感器误差、执行器故障都给出数学安全保证。</p><p>理解论文时，把“任务表现”“实时性”“约束安全”作为不同问题。若以后研究航天 GNC，可以把 VLA 的语义决策思路与可靠控制结合；安全滤波、验证和故障接管需要单独设计，不能当成 π0.5 原有模块。</p>${sourceLinks([['blog', '官方结果与局限'], ['paper', '论文系统与评估范围']])}`)}
  ${sourceLinks([['paper', 'π0.5 原始论文 v1'], ['blog', '官方模型介绍']])}`;
}

function trainingPath() {
  return `<div class="lesson-panel-lead"><h3>训练用答案改参数，推理用参数算新答案</h3><p>训练时，示范数据提供观察、指令和目标动作。模型先预测，再计算误差，把误差对参数的影响反向传回去。部署时通常固定参数，只做前向计算。</p></div>
  ${flow([
    ['blue', '取一个示范', '例如：这个画面和这条指令下，示范者接下来怎样移动。', '(观察, 指令, 目标动作)'],
    ['orange', '构造学习问题', '抽取噪声和 flow 时间，把已知动作混成中间样本，目标方向可计算。', 'zₜ = tε + (1−t)A'],
    ['purple', '预测并算损失', '动作专家预测向量场，与监督目标比较；文字路径则比较 token 概率。', '预测 → loss'],
    ['teal', '反传与更新', '梯度说明参数朝哪个方向改变会影响损失；优化器据此改参数。', 'θ ← θ − η∇θL'],
  ])}
  <div class="lesson-two"><div class="lesson-box"><p class="lesson-mini-label">训练：答案已知</p><h4>插值制造一道练习题</h4><p>取目标动作 A=0.8、噪声 ε=−0.4、t=0.5，得到 zₜ=0.2；监督向量场为 ε−A=−1.2。目标可见，所以能计算误差。</p><div class="lesson-equation">预测 v = −1.0
平方误差 = (−1.0 − (−1.2))²
         = 0.04</div></div><div class="lesson-box"><p class="lesson-mini-label">推理：答案未知</p><h4>按学到的方向修订草稿</h4><p>从噪声出发，只给观察和任务条件。每一轮由网络预测 v。不能偷看示范动作 A，也不能直接把草稿插值到已知答案。</p><div class="lesson-equation">当前 z = 0.2，预测 v = −1.0
Δt = −0.1
下一步 z = 0.2 + (−0.1)×(−1.0)
         = 0.3</div></div></div>
  <p class="lesson-small">这里统一使用 openpi 的时间方向：t=1 是噪声，t=0 是动作。数学文献可能采用相反方向；比较时要同时检查插值定义、向量场符号和积分方向。</p>
  ${details('原始 π0.5、后续 KI 与公开训练入口，分开看', `<div class="lesson-table-wrap"><table class="lesson-compare"><thead><tr><th>对象</th><th>要理解的训练路线</th><th>别混淆的地方</th></tr></thead><tbody><tr><td>2025 年 4 月原始论文</td><td>先以离散 token 预训练；后训练加入连续动作专家，并结合文字与连续动作目标。</td><td>这是论文原始的两阶段叙述。</td></tr><tr><td>2025 年 5 月 KI 后续研究</td><td>联合学习离散动作与连续动作，阻断动作专家梯度流回视觉语言骨干，发展为单阶段配方。</td><td>KI 阻断特定梯度路径；不是让整个骨干永远冻结。</td></tr><tr><td>openpi 公开 π0.5 路径</td><td>发布权重采用 KI；公开说明支持 flow head 的训练和推理。</td><td>一个 flow loss 函数，不等于完整复现上述所有训练任务。</td></tr></tbody></table></div>${sourceLinks([['paper', '原始论文 IV-C / IV-D'], ['ki', 'KI 官方介绍'], ['readme', '公开范围'], ['release', '发布权重说明']])}`)}

     ↑                    ↑
离散 token 损失        连续动作损失
     ↑                    ╳── 不沿接口回传到骨干</div><p>“信息能通过”和“梯度能通过”是两件事。KI 改变训练时的更新路径，并不意味着推理时动作专家看不到图像或指令；也不意味着已经给机器人提供安全保证。</p>${sourceLinks([['ki', 'Knowledge Insulation 官方研究']])}`)}

function bindTrainer(root) {
  const trainer = root.querySelector('[data-lesson-trainer]');
  const weight = trainer.querySelector('[data-lesson-weight]');
  const rate = trainer.querySelector('[data-lesson-rate]');
  let w = 0.5;
  let updates = 0;
  const f = value => Math.abs(value) < 0.0005 ? '0.000' : value.toFixed(3);
  function draw() {
    const prediction = 2 * w;
    const error = prediction - 3;
    const gradient = 2 * error;
    trainer.querySelector('[data-lesson-weight-label]').textContent = w.toFixed(2);
    trainer.querySelector('[data-lesson-rate-label]').textContent = Number(rate.value).toFixed(2);
    trainer.querySelector('[data-lesson-w]').textContent = f(w);
    trainer.querySelector('[data-lesson-pred]').textContent = f(prediction);
    trainer.querySelector('[data-lesson-grad]').textContent = f(gradient);
    trainer.querySelector('[data-lesson-loss]').textContent = f(0.5 * error * error);
    trainer.querySelector('[data-lesson-chain]').textContent = `前向：ŷ = ${f(w)} × 2 = ${f(prediction)}\n误差：ŷ − y = ${f(prediction)} − 3 = ${f(error)}\n反向：∂L/∂w = (∂L/∂ŷ) × (∂ŷ/∂w) = ${f(error)} × 2 = ${f(gradient)}`;
  }
  weight.addEventListener('input', () => {
    w = Number(weight.value); updates = 0; draw();
    trainer.querySelector('[data-lesson-update]').textContent = '你手动改变了参数。现在可以观察预测和损失，或让梯度下降执行一次更新。';
  });
  rate.addEventListener('input', draw);
  trainer.querySelector('[data-lesson-step]').addEventListener('click', () => {
    const old = w;
    const gradient = (2 * w - 3) * 2;
    const eta = Number(rate.value);
    const previousLoss = 0.5 * (2 * w - 3) ** 2;
    w -= eta * gradient;
    weight.value = String(w);
    updates += 1;
    draw();
    trainer.querySelector('[data-lesson-update]').textContent = `第 ${updates} 次更新：w ← ${f(old)} − ${eta.toFixed(2)} × (${f(gradient)}) = ${f(w)}。损失从 ${f(previousLoss)} 变为 ${f(0.5 * (2 * w - 3) ** 2)}。目标是让 2w 接近 3。`;
  });
  trainer.querySelector('[data-lesson-reset]').addEventListener('click', () => {
    w = 0.5; updates = 0; weight.value = '0.5'; rate.value = '0.1'; draw();
    trainer.querySelector('[data-lesson-update]').textContent = '已恢复 w=0.5、η=0.1。点击一次更新：你会得到 w=0.9，损失由 2 降至 0.72。';
  });
  draw();
}

/** Render the inference/training walkthrough into a DOM element or selector. */
function renderLessons(container) {
  const host = hostFor(container);
  const id = `lesson-${++lessonInstance}`;
  const root = document.createElement('div');
  root.className = 'lesson-root';
  const names = ['openpi 公开动作路径', '论文分层系统', '训练如何进行'];
  root.innerHTML = `<div class="lesson-head"><div><p class="lesson-kicker">FROM OBSERVATION TO ACTION</p><h2>训练与推理：一张图里的不同阶段</h2><p class="lesson-intro">先分清你正在看哪套系统，再追踪数据怎样流动。展开每一步，会看到数字、参数和程序各自承担什么工作。</p></div><span class="lesson-badge">论文／源码／教学例子分开标明</span></div><div class="lesson-tabs" role="tablist" aria-label="选择学习路径">${names.map((name, i) => `<button type="button" role="tab" class="lesson-tab" id="${id}-tab-${i}" aria-controls="${id}-panel-${i}" aria-selected="${i === 0}" tabindex="${i === 0 ? 0 : -1}" data-lesson-tab="${i}">${name}</button>`).join('')}</div>${[publicPath(), paperPath(), trainingPath()].map((content, i) => `<section class="lesson-panel" id="${id}-panel-${i}" role="tabpanel" aria-labelledby="${id}-tab-${i}" tabindex="0"${i !== 0 ? ' hidden' : ''}>${content}</section>`).join('')}${clocks()}${quizMarkup()}<p class="lesson-footnote">内容对应 π0.5 原始论文、后续 KI 研究及公开 openpi 路径。页面中的小数字模型用于教学，不表示读取了真实模型的中间激活。</p>`;
  host.replaceChildren(root);
  const tabs = [...root.querySelectorAll('[data-lesson-tab]')];
  const panels = [...root.querySelectorAll('[role="tabpanel"]')];
  function activate(index, focus = false) {
    tabs.forEach((tab, i) => { tab.setAttribute('aria-selected', String(i === index)); tab.tabIndex = i === index ? 0 : -1; panels[i].hidden = i !== index; });
    if (focus) tabs[index].focus();
  }
  tabs.forEach((tab, index) => {
    tab.addEventListener('click', () => activate(index));
    tab.addEventListener('keydown', event => {
      const offset = { ArrowRight: 1, ArrowLeft: -1 }[event.key];
      let target = offset ? (index + offset + tabs.length) % tabs.length : event.key === 'Home' ? 0 : event.key === 'End' ? tabs.length - 1 : null;
      if (target !== null) { event.preventDefault(); activate(target, true); }
    });
  });
  root.querySelectorAll('[data-lesson-question]').forEach(card => {
    const q = QUIZ[Number(card.dataset.lessonQuestion)];
    const buttons = [...card.querySelectorAll('[data-lesson-answer]')];
    buttons.forEach(button => button.addEventListener('click', () => {
      const correct = Number(button.dataset.lessonAnswer) === q.correct;
      buttons.forEach(other => { other.setAttribute('aria-pressed', String(other === button)); other.classList.toggle('lesson-correct', other === button && correct); });
      const feedback = card.querySelector('.lesson-feedback');
      feedback.className = `lesson-feedback ${correct ? 'lesson-is-correct' : 'lesson-is-wrong'}`;
      feedback.textContent = correct ? q.success : q.retry;
    }));
  });
  bindTrainer(root);
  return root;
}

const BEGINNER_TERMS = [

function renderLabs(){labCleanup?.();labCleanup=null;main.innerHTML=`<section class="page-wrap"><div class="page-heading"><span class="eyebrow">Learn by changing the numbers</span><h1>把一个数改掉，看看会发生什么。</h1><p>这些微型实验使用明确给出的教学参数。每一步都可重算，不需要下载模型或 GPU。</p></div><div class="lab-nav">${Object.entries(labNames).map(([id,title],i)=>`<button data-select-lab="${id}" class="${id===activeLab?'active':''}"><span>0${i+1}</span>${title}</button>`).join('')}</div><div id="lab-root" class="lab-container"></div></section>`;labCleanup=renderLab(activeLab,$('#lab-root'));document.querySelectorAll('[data-select-lab]').forEach(b=>b.onclick=()=>{activeLab=b.dataset.selectLab;renderLabs();history.replaceState(null,'','#labs/'+activeLab)})}

function renderSources(){main.innerHTML=`<section class="page-wrap"><div class="page-heading"><span class="eyebrow">Trace every idea back to its source</span><h1>讲清楚，也标清楚。</h1><p>模型事实、实现选择和教学简化，在这里各有出处。</p></div><div class="scope-note"><b>本站的范围</b><br>默认计算地图采用 openpi 的 π0.5 连续动作路径与默认配置；不在浏览器中运行 π0.5 权重。小矩阵、注意力数值、场景和轨迹是可复算的教学示例，不是对真实模型内部激活的测量。</div><div class="source-grid">${READING.map(r=>`<article class="source-card"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)} ↗</a><p>${esc(r.why)}</p></article>`).join('')}</div><h2 class="section-title">阅读时值得保留的几个区别</h2><div class="readable"><p><b>论文系统与公开接口：</b>论文描述高层子任务与低层动作的分层系统；openpi 的 sample_actions() 是连续动作采样接口，不能把高层规划当成它自动完成的步骤。</p><p><b>配置尺寸与机器人尺寸：</b>50 是默认动作块长度，32 是模型动作通道容量（含填充），200 是默认文本槽位数。它们不等于机器人自由度、固定控制频率或每次有效 token 数。</p><p><b>时间约定：</b>本站统一采用 openpi 代码的 t=1 噪声 → t=0 动作。论文可使用相反端点约定，公式要连同约定阅读。</p><p><b>泛化与可靠性：</b>在新环境中表现好，是经验性能力。碰撞约束、执行器限幅和形式化安全保证需要额外系统设计；本站不会把安全滤波器画成 π0.5 原生模块。</p></div><h2 class="section-title">视觉与交互致谢</h2><p class="readable">参考 <a href="https://poloclub.github.io/transformer-explainer/" target="_blank" rel="noopener">Polo Club 的 Transformer Explainer</a>：浅色计算画布、按语义着色的张量，以及在总览与具体运算之间自由往返。本站独立实现，使用中文内容和 π0.5 专属数据流。</p><p class="mini-note">资料核对日期：2026-10-23。链接指向上游源码；上游默认配置可能继续更新。</p></section>`}
function openModule(id){if(!MODULES[id])return;pause();activeModule=id;drawerTab='intuition';returnFocus=document.activeElement;currentStep=order.indexOf(id);updateStep();renderDrawer();$('#scrim').hidden=false;$('#detail').hidden=false;document.body.classList.add('modal-open');$('#detail-close').focus();history.replaceState(null,'','#module/'+id)}
function renderDrawer(){const m=MODULES[activeModule];let body='';if(drawerTab==='intuition'){body=`<p class="detail-summary">${esc(m.summary)}</p><div class="tensor-io"><div><label>输入 INPUT</label><code>${esc(m.input)}</code></div><span>→</span><div><label>输出 OUTPUT</label><code>${esc(m.output)}</code></div></div><ol class="detail-steps">${m.steps.map(s=>`<li><b>${esc(s.title)}</b><p>${esc(s.body)}</p></li>`).join('')}</ol><div class="pitfall"><b>容易混淆的地方</b><br>${esc(m.pitfall)}</div>`}else if(drawerTab==='math'){body=`<p class="detail-summary">把文字解释落到数字上。以下示例用于理解运算；真实模型的学习参数并不等于这些小数字。</p><h3>计算关系</h3><pre class="formula">${esc(m.formula)}</pre><h3>跟着算一个例子</h3><div class="detail-example">${esc(m.example)}</div><div class="tensor-io"><div><label>完整输入形状</label><code>${esc(m.input)}</code></div><span>→</span><div><label>完整输出形状</label><code>${esc(m.output)}</code></div></div><div class="pitfall">${esc(m.pitfall)}</div>`}else{body=`<p class="detail-summary">下面是帮助理解数据流的简化伪代码。查看底部链接，可以对照官方实现中的具体类和函数。</p><pre class="formula">${esc(m.code)}</pre><h3>对照源码阅读</h3><p class="readable">先确认输入张量的形状，再沿每一个变换查看输出。省略的批量维 B、掩码和机器人适配器，在实际部署时都需要保留。</p>`}
$('#detail').className=m.color;$('#detail').innerHTML=`<div class="detail-top"><span class="detail-kicker">${String(order.indexOf(activeModule)+1).padStart(2,'0')} / 14 · ${esc(m.kicker.replace(/^\d+ · /,''))}</span><button id="detail-close" class="detail-close" aria-label="关闭模块详情">×</button><h2 id="detail-title">${esc(m.title)}</h2><div class="detail-tabs" role="tablist"><button data-detail-tab="intuition" role="tab" aria-selected="${drawerTab==='intuition'}" class="${drawerTab==='intuition'?'active':''}">先看懂</button><button data-detail-tab="math" role="tab" aria-selected="${drawerTab==='math'}" class="${drawerTab==='math'?'active':''}">张量与计算</button><button data-detail-tab="code" role="tab" aria-selected="${drawerTab==='code'}" class="${drawerTab==='code'?'active':''}">对应实现</button></div></div><div class="detail-body">${body}${m.lab?`<button class="detail-lab" id="open-module-lab">亲手改数字 · ${labNames[m.lab]} ↗</button>`:''}<h3>来源与进一步阅读</h3><div class="detail-sources">${m.sources.map(s=>`<a target="_blank" rel="noopener" href="${esc(s.url)}">${esc(s.title)} ↗</a>`).join('')}</div><div class="detail-nav"><button id="prev-module" ${currentStep===0?'disabled':''}>← 上一个模块</button><button id="next-module" ${currentStep===order.length-1?'disabled':''}>下一个模块 →</button></div></div>`;
$('#detail-close').onclick=()=>closeDrawer(true);document.querySelectorAll('[data-detail-tab]').forEach(b=>b.onclick=()=>{drawerTab=b.dataset.detailTab;renderDrawer()});$('#open-module-lab')?.addEventListener('click',()=>{activeLab=m.lab;closeDrawer();navigate('labs')});$('#prev-module').onclick=()=>openModule(order[currentStep-1]);$('#next-module').onclick=()=>openModule(order[currentStep+1]);$('#detail').scrollTop=0;
}
function closeDrawer(updateHash=false){$('#detail').hidden=true;$('#scrim').hidden=true;document.body.classList.remove('modal-open');if(updateHash){history.replaceState(null,'','#'+activeView);returnFocus?.focus()}activeModule=null}
$('#scrim').onclick=()=>closeDrawer(true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#detail').hidden)closeDrawer(true);if(e.key==='Tab'&&!$('#detail').hidden){const items=[...$('#detail').querySelectorAll('button:not(:disabled),a[href]')];const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
document.querySelectorAll('.topbar [data-view]').forEach(b=>b.onclick=()=>navigate(b.dataset.view));
function route(){const [a,b]=location.hash.slice(1).split('/');if(a==='module'&&MODULES[b]){navigate('map',false);openModule(b)}else if(a==='labs'){if(labNames[b])activeLab=b;navigate('labs',false)}else navigate(['map','lessons','beginner','sources'].includes(a)?a:'map',false)}
window.addEventListener('hashchange',route);route();

})();</script>
</body></html>
